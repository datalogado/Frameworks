<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introdução ao Javascript</title>
</head>
<body>
    
    <script>

        function calcularIMC(peso, altura){
            var imc = peso / (altura * altura);

            if(imc >= 18.5 && imc <= 24.9){
                document.writeln("Peso Saudável");
            } else if(imc >= 17 && imc <= 18.4){
                document.writeln('Magreza leve');
            } else if(imc >= 16 && imc <= 16.9){
                document.writeln('Magreza moderada');
            } else if(imc < 16){
                document.writeln('Magreza extrema');
            } else if(imc >= 25 && imc <= 29.9){
                document.writeln('Sobrepeso');
            } else if(imc >= 30 && imc <= 34.9){
                document.writeln('Obesidade grau 1');
            } else if(imc >= 35 && imc <= 39.9){
                document.writeln('Obesidade severa');
            } else if(imc > 40){
                document.writeln('Obesidade mórbida');
            } else{
                document.writeln('valor inválido');
            }

            document.writeln(" (" + imc + ")");
        }

        calcularIMC(115, 1.65); // IMC aproximado: 42.24

    </script>
</body>
</html>
